<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gradient Image Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #111318;
        --muted: #6b7280;
        --line: #e6e8ee;
        --accent: #111318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 20px 72px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.03em;
        margin: 0 0 8px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 28px;
        line-height: 1.6;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 24px;
        align-items: start;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }
      textarea { min-height: 72px; resize: vertical; }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      button {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .preview {
        aspect-ratio: 1;
        width: 100%;
        border-radius: 28px;
        overflow: hidden;
        background: #e8eaef;
        box-shadow: 0 16px 40px rgba(17, 19, 24, 0.08);
      }
      .preview img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      code {
        display: block;
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        background: #111318;
        color: #e8eaef;
        font-size: 12px;
        overflow-x: auto;
        white-space: nowrap;
      }
      @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gradient Image Generator</h1>
      <p class="lede">
        サイズ・シード・色を指定すると、有機的なメッシュグラデ画像を返します。
      </p>
      <div class="layout">
        <form class="card" id="form">
          <div class="row">
            <div>
              <label for="w">幅</label>
              <input id="w" name="w" type="number" min="16" max="2048" value="800" />
            </div>
            <div>
              <label for="h">高さ</label>
              <input id="h" name="h" type="number" min="16" max="2048" value="800" />
            </div>
          </div>
          <label for="seed">シード</label>
          <input id="seed" name="seed" value="jalapeno" />
          <label for="colors">色（カンマ区切り HEX）</label>
          <textarea id="colors" name="colors">#2EE59D, #4FC3F7, #00ACC1, #80DEEA</textarea>
          <div class="row">
            <div>
              <label for="warp">ワープ</label>
              <input id="warp" name="warp" type="number" min="0" max="1.5" step="0.05" value="0.62" />
            </div>
            <div>
              <label for="grain">グレイン</label>
              <input id="grain" name="grain" type="number" min="0" max="0.2" step="0.005" value="0.035" />
            </div>
          </div>
          <button type="submit">画像を生成</button>
          <code id="url"></code>
        </form>
        <div>
          <div class="preview">
            <img id="preview" alt="生成されたグラデーション" />
          </div>
        </div>
      </div>
    </main>
    <script>
      const form = document.getElementById("form");
      const preview = document.getElementById("preview");
      const urlEl = document.getElementById("url");

      function buildUrl() {
        const data = new FormData(form);
        const params = new URLSearchParams();
        for (const [key, value] of data.entries()) {
          params.set(key, String(value).trim());
        }
        return `/gradient?${params.toString()}`;
      }

      function render() {
        const url = buildUrl();
        preview.src = url;
        urlEl.textContent = url;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        render();
      });

      render();
    </script>
  </body>
</html>
