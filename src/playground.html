<!doctype html>
<html lang="ja" data-i18n-title="pg.title">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Playground · Gradient Image API</title>
    <link id="favicon" rel="icon" type="image/png" href="/favicon.ico" />
    <link id="touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/presets.js"></script>
    <script>
      (() => {
        const p = gigPick();
        document.getElementById("favicon").href = gigPath(64, 64, p);
        document.getElementById("touch-icon").href = gigPath(180, 180, p);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #12141a;
        --panel-2: #181b23;
        --text: #f4f6fb;
        --muted: #8b93a7;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent: #f4f6fb;
        --ok: #7ee0b2;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; overflow-x: clip; }
      :focus-visible {
        outline: 2px solid #7ee0b2;
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: 12px;
        top: -40px;
        z-index: 50;
        background: #111318;
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
      }
      .skip:focus { top: 12px; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 60;
        background: #f4f6fb;
        color: #111318;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 999px;
        box-shadow: 0 12px 40px rgba(0,0,0,.35);
        max-width: calc(100vw - 24px);
        bottom: calc(16px + env(safe-area-inset-bottom));
      }
      .toast[hidden] { display: none; }
      .tip-float {
        position: fixed;
        z-index: 10000;
        max-width: min(280px, calc(100vw - 16px));
        background: #f4f6fb;
        color: #111318;
        font-size: 11px;
        font-weight: 650;
        line-height: 1.35;
        padding: 5px 8px;
        border-radius: 7px;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0,0,0,.28);
      }
      .tip-float[hidden] { display: none; }
      .field-label {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 700;
      }
      input.invalid { border-color: #f87171; }
      .preview.loading::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(11,12,16,.28);
      }
      .preview.err { box-shadow: 0 0 0 2px #f87171 inset; }
      .urlbar code { cursor: pointer; }
      button:disabled, .add-color:disabled { opacity: .4; cursor: not-allowed; }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; scroll-behavior: auto !important; }
        .preview img { transition: none; }
      }
      body {
        margin: 0;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(46, 229, 157, 0.12), transparent 50%),
          radial-gradient(900px 500px at 110% 10%, rgba(79, 195, 247, 0.1), transparent 46%),
          var(--bg);
        line-height: 1.45;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 12, 16, 0.72);
        backdrop-filter: blur(18px);
        padding-top: env(safe-area-inset-top);
      }
      .bar {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        text-decoration: none;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(135deg, #2ee59d, #4fc3f7);
      }
      nav { display: flex; gap: 6px; }
      nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        padding: 7px 11px;
        border-radius: 999px;
      }
      nav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
      nav a.active { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      .end { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
      .lang-switch {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--panel);
      }
      .lang-switch button {
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 999px;
        padding: 5px 9px;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .lang-switch button.on { background: var(--text); color: #111318; }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 72px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        letter-spacing: -0.05em;
        font-weight: 650;
      }
      .lede {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 13px;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }
      .preview-wrap {
        position: sticky;
        top: 84px;
      }
      .preview {
        position: relative;
        width: 100%;
        aspect-ratio: var(--ar, 1);
        max-height: min(48vh, 520px);
        border-radius: 28px;
        overflow: hidden;
        background: #1a1d26;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        border: 1px solid var(--line);
      }
      .preview img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .preview img.ready { opacity: 1; }
      .preview { cursor: pointer; }
      .urlbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        padding: 10px 10px 10px 14px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .urlbar code {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        white-space: normal;
        color: #c9d0df;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .urlbar button {
        flex: none;
      }
      .share {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .share .ghost {
        padding: 7px 10px;
        font-size: 12px;
      }
      .ai-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .ai-row .label {
        margin: 0;
      }
      .ai-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ai-links a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 0;
        color: #fff;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }
      .ai-links a[data-ai="chatgpt"] { background: #10a37f; }
      .ai-links a[data-ai="claude"] { background: #d97757; }
      .ai-links a[data-ai="gemini"] { background: #1a73e8; }
      .ai-links a:hover { filter: brightness(1.08); }
      .ai-links .logo { width: 14px; height: 14px; pointer-events: none; }
      .panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 28%), var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px;
      }
      .block + .block { margin-top: 18px; }
      .label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .label span { font-variant-numeric: tabular-nums; color: #d5dbe8; text-transform: none; letter-spacing: 0; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      input[type="number"], input[type="text"], textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        outline: none;
      }
      input:focus, textarea:focus {
        border-color: rgba(126, 224, 178, 0.55);
        box-shadow: 0 0 0 3px rgba(126, 224, 178, 0.12);
      }
      input[type="range"] {
        width: 100%;
        accent-color: #7ee0b2;
      }
      .seed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .seg, .palettes { display: flex; flex-wrap: wrap; gap: 8px; }
      .seg button, .chip, .icon-btn, .ghost, .primary {
        border: 1px solid var(--line-strong);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 11px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .seg button.on, .palette.on {
        border-color: transparent;
        background: var(--text);
        color: #111318;
      }
      .icon-btn { width: 42px; border-radius: 12px; }
      .palette {
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 10px 6px 6px;
      }
      .swatches { display: flex; }
      .swatches i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: -5px;
        border: 2px solid var(--panel-2);
        display: block;
      }
      .palette.on .swatches i { border-color: #f4f6fb; }
      .color-list { display: grid; gap: 8px; }
      .color-row {
        display: grid;
        grid-template-columns: 44px 1fr 36px;
        gap: 8px;
        align-items: center;
      }
      .color-row input[type="color"] {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--panel-2);
        cursor: pointer;
      }
      .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
      .color-row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 8px;
      }
      .color-row input[data-hex] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .add-color {
        width: 100%;
        margin-top: 8px;
        border-radius: 12px;
      }
      .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
      .actions #copy-main { grid-column: 1 / -1; }
      .actions #reset { grid-column: 1 / -1; }
      .primary {
        grid-column: 1 / -1;
        border-radius: 14px;
        padding: 12px;
        background: var(--text);
        color: #111318;
        border: 0;
        font-size: 14px;
      }
      .ghost { border-radius: 14px; padding: 11px; }
      .ghost.copied { color: #0b0c10; background: var(--ok); border-color: transparent; }
      .brand-short { display: none; }
      .size-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .size-tools .seg { flex: 1; min-width: 0; }
      .more {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 0 12px;
      }
      .more summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 0;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .more summary::-webkit-details-marker { display: none; }
      .more .urlbar {
        margin-top: 0;
        border: 0;
        background: transparent;
        padding: 0 0 12px;
      }
      .more .share, .more .ai-row { margin: 0 0 12px; }
      .dock { display: none; }
      @media (min-width: 1100px) {
        .layout {
          grid-template-columns: minmax(0, 1.25fr) minmax(340px, 400px);
          grid-template-areas: "preview panel";
        }
        .preview-wrap { grid-area: preview; position: sticky; top: 84px; }
        .panel { grid-area: panel; }
        .preview { max-height: min(72vh, 720px); }
        .more {
          border: 0;
          background: transparent;
          padding: 0;
          border-radius: 0;
        }
        .more summary { display: none; }
      }
      @media (max-width: 1099px) {
        .bar {
          flex-wrap: nowrap;
          padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
          min-height: 52px;
          gap: 8px;
        }
        .brand { min-width: 0; }
        .brand-full { display: none; }
        .brand-short { display: inline; }
        .end { flex-wrap: nowrap; gap: 8px; }
        nav { gap: 2px; }
        nav a { padding: 6px 9px; font-size: 12px; }
        nav a.extra { display: none; }
        main { padding: 12px 14px calc(92px + env(safe-area-inset-bottom)); }
        h1, .lede { display: none; }
        .layout { display: flex; flex-direction: column; gap: 12px; }
        .preview-wrap {
          order: -1;
          position: static;
        }
        .preview {
          width: min(100%, 28vh);
          max-height: 28vh;
          height: auto;
          margin: 0 auto;
          border-radius: 18px;
          box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        }
        .panel { padding: 14px; border-radius: 18px; }
        .block + .block { margin-top: 14px; }
        .seg, .palettes {
          flex-wrap: nowrap;
          overflow-x: auto;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
        }
        .seg::-webkit-scrollbar, .palettes::-webkit-scrollbar { display: none; }
        .seg button, .palette { flex: 0 0 auto; }
        .actions { display: none; }
        .urlbar code {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .dock {
          display: grid;
          grid-template-columns: 1.4fr 1fr;
          gap: 8px;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
          background: rgba(11, 12, 16, 0.92);
          backdrop-filter: blur(16px);
          border-top: 1px solid var(--line);
        }
        .dock .primary {
          grid-column: auto;
          margin: 0;
          padding: 13px 12px;
        }
        .dock .ghost { padding: 13px 12px; }
        .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
        .color-row { grid-template-columns: 40px 1fr 36px; }
        .color-row input[type="color"] { width: 40px; height: 40px; }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#form" data-i18n="pg.skip">操作にスキップ</a>
    <header>
      <div class="bar">
        <a class="brand" href="/"><span class="mark"></span><span class="brand-full">Gradient Image API</span><span class="brand-short">Gradient</span></a>
        <div class="end">
          <nav>
            <a class="active" href="/playground" data-i18n-tip="nav.play">Playground</a>
            <a href="/docs" data-i18n-tip="nav.docs">Docs</a>
            <a class="extra" href="/openapi.json" data-i18n-tip="nav.openapi">OpenAPI</a>
            <a class="extra" href="/llms.txt" data-i18n-tip="nav.llms">llms.txt</a>
            <a class="extra" href="https://github.com/ituyama/gradient-image-generator" target="_blank" rel="noreferrer" data-i18n-tip="nav.github">GitHub</a>
          </nav>
          <div class="lang-switch" role="group" data-i18n-aria="lang.label">
            <button type="button" data-lang="ja">JA</button>
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="zh">中文</button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <h1 data-i18n="pg.h1">Playground</h1>
      <p class="lede" data-i18n="pg.hint">値を動かすとすぐ画像が変わります。R シード / C コピー / S 保存</p>
      <div class="layout">
        <form class="panel" id="form">
          <div class="block">
            <div class="label"><span data-i18n="pg.size">サイズ</span> <span id="size-hint">800 × 800</span></div>
            <div class="row">
              <div>
                <label class="field-label" for="w" data-i18n="pg.width">幅</label>
                <input id="w" name="w" type="number" min="16" max="2048" value="800" inputmode="numeric" />
              </div>
              <div>
                <label class="field-label" for="h" data-i18n="pg.height">高さ</label>
                <input id="h" name="h" type="number" min="16" max="2048" value="800" inputmode="numeric" />
              </div>
            </div>
            <div class="size-tools">
              <div class="seg" id="sizes"></div>
              <button class="icon-btn" type="button" id="swap" data-i18n-tip="pg.swap" data-i18n-aria="pg.swap">⇄</button>
            </div>
          </div>
          <div class="block">
            <div class="label" data-i18n="pg.seed">シード</div>
            <div class="seed-row">
              <input id="seed" name="seed" type="text" value="jalapeno" autocomplete="off" spellcheck="false" />
              <button class="icon-btn" type="button" id="random-seed" data-i18n-tip="pg.seedRand" data-i18n-aria="pg.seedRand">↺</button>
            </div>
          </div>
          <div class="block">
            <div class="label" data-i18n="pg.presets">プリセット</div>
            <div class="palettes" id="palettes"></div>
          </div>
          <div class="block">
            <div class="label"><span data-i18n="pg.colors">カラー</span> <span id="color-count">4 / 8</span></div>
            <input id="colors" name="colors" type="hidden" value="#2EE59D, #4FC3F7, #00ACC1, #80DEEA" />
            <div class="color-list" id="color-list"></div>
            <button class="ghost add-color" type="button" id="add-color" data-i18n="pg.addColor" data-i18n-tip="pg.addColorTip">色を追加</button>
          </div>
          <div class="block row">
            <div>
              <div class="label"><span data-i18n="pg.warp">ワープ</span> <span id="warp-val">0.62</span></div>
              <input id="warp" name="warp" type="range" min="0" max="1.5" step="0.01" value="0.62" data-i18n-aria="pg.warp" />
            </div>
            <div>
              <div class="label"><span data-i18n="pg.grain">グレイン</span> <span id="grain-val">0.035</span></div>
              <input id="grain" name="grain" type="range" min="0" max="0.2" step="0.005" value="0.035" data-i18n-aria="pg.grain" />
            </div>
          </div>
          <div class="block">
            <div class="label"><span data-i18n="pg.blur">ぼかし</span> blur <span id="blur-val">0</span></div>
            <input id="blur" name="blur" type="range" min="0" max="32" step="1" value="0" data-i18n-aria="pg.blur" />
          </div>
          <div class="actions">
            <button class="primary" type="button" id="copy-main" data-i18n="pg.copy" data-i18n-tip="pg.copyUrl">画像 URL をコピー</button>
            <button class="ghost" type="button" id="open" data-i18n="pg.open" data-i18n-tip="pg.openTip">新しいタブ</button>
            <button class="ghost" type="button" id="download" data-i18n="pg.save" data-i18n-tip="pg.saveTip">保存</button>
            <button class="ghost" type="button" id="copy-play" data-i18n="pg.copyPlay" data-i18n-tip="pg.copyPlayTip">この画面</button>
            <button class="ghost" type="button" id="reset" data-i18n="pg.reset" data-i18n-tip="pg.resetTip">リセット</button>
          </div>
        </form>
        <div class="preview-wrap">
          <div class="preview" id="frame" data-i18n-tip="pg.copyUrl" data-tip="画像 URL をコピー">
            <img id="preview" alt="生成されたグラデーション" data-i18n-aria="pg.preview" />
          </div>
          <details class="more" id="more" open>
            <summary data-i18n="pg.more">共有とチャット</summary>
          <div class="urlbar">
            <code id="url" tabindex="0" data-i18n-tip="pg.copyUrl"></code>
            <button class="ghost" type="button" id="copy" data-i18n="pg.copy" data-i18n-tip="pg.copyUrl">コピー</button>
          </div>
          <div class="share" id="share">
            <button class="ghost" type="button" id="copy-md" data-i18n-tip="pg.copyMd">MD</button>
            <button class="ghost" type="button" id="copy-html" data-i18n-tip="pg.copyHtml">HTML</button>
          </div>
          <div class="ai-row">
            <div class="label" data-i18n="pg.chat">チャット</div>
            <div class="ai-links" id="ai-links">
              <a data-ai="chatgpt" target="_blank" rel="noreferrer" data-i18n-tip="pg.chatGpt">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.374v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.777-5.833-3.387L15.119 7.12a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.409-.667zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.2V6.865a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.37-3.453l-.142.08-4.778 2.758a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>
                ChatGPT
              </a>
              <a data-ai="claude" target="_blank" rel="noreferrer" data-i18n-tip="pg.chatClaude">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>
                Claude
              </a>
              <a data-ai="gemini" target="_blank" rel="noreferrer" data-i18n-tip="pg.chatGemini">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6c.4 5 2.6 8.8 9.4 10.4C14.6 13.6 12.4 17.4 12 22.4 11.6 17.4 9.4 13.6 2.6 12 9.4 10.4 11.6 6.6 12 1.6z"/></svg>
                Gemini
              </a>
            </div>
          </div>
          </details>
        </div>
      </div>
    </main>
    <div class="dock" id="dock">
      <button class="primary" type="button" id="copy-dock" data-i18n="pg.copy">画像 URL をコピー</button>
      <button class="ghost" type="button" id="save-dock" data-i18n="pg.save">保存</button>
    </div>
    <script src="/i18n.js"></script>
    <script>
      const t = (key, vars) => window.I18N ? I18N.t(key, vars) : key;
      const form = document.getElementById("form");
      const preview = document.getElementById("preview");
      const urlEl = document.getElementById("url");
      const frame = document.getElementById("frame");
      const copyBtn = document.getElementById("copy");
      const warpVal = document.getElementById("warp-val");
      const grainVal = document.getElementById("grain-val");
      const blurVal = document.getElementById("blur-val");

      const sizes = [
        ["1:1", 800, 800],
        ["OG", 1200, 630],
        ["HD", 1920, 1080],
        ["Story", 1080, 1920],
      ];
      const palettes = (window.GIG_PRESETS || [
        { seed: "mint", colors: "2EE59D,4FC3F7,00ACC1,80DEEA" },
        { seed: "sunset", colors: "FF6B6B,FFD93D,FF8C42,C44569" },
        { seed: "twilight", colors: "7C5CFF,49C6E5,F472B6,1E1B4B" },
        { seed: "peach", colors: "FFB4A2,E5989B,FFCDB2,B5838D" },
      ]).map((p) => [p.seed, p.colors]);

      const sizeBox = document.getElementById("sizes");
      for (const [label, w, h] of sizes) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.dataset.w = String(w);
        button.dataset.h = String(h);
        button.addEventListener("click", () => {
          form.w.value = w;
          form.h.value = h;
          render();
        });
        sizeBox.append(button);
      }

      const colorList = document.getElementById("color-list");
      const paletteBox = document.getElementById("palettes");

      function normalizeHex(raw) {
        let hex = String(raw).trim();
        if (!hex) return null;
        if (!hex.startsWith("#")) hex = `#${hex}`;
        if (/^#[0-9a-f]{3}$/i.test(hex)) {
          hex = `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`;
        }
        return /^#[0-9a-f]{6}$/i.test(hex) ? hex.toUpperCase() : null;
      }

      function parseColorList(raw) {
        return String(raw)
          .split(/[,| ]+/)
          .map(normalizeHex)
          .filter(Boolean);
      }

      function writeColors() {
        const hexes = [...colorList.querySelectorAll("[data-hex]")].map((input) => input.value);
        form.colors.value = hexes.join(", ");
      }

      function addColorRow(hex) {
        const color = normalizeHex(hex) ?? "#80DEEA";
        const row = document.createElement("div");
        row.className = "color-row";
        row.innerHTML = `
          <input type="color" value="${color}" data-i18n-aria="pg.color" aria-label="${t("pg.color")}" />
          <input data-hex type="text" spellcheck="false" maxlength="7" value="${color}" aria-label="HEX" />
          <button class="icon-btn" type="button" data-i18n-aria="pg.removeColor" data-i18n-tip="pg.removeColor" aria-label="${t("pg.removeColor")}" data-tip="${t("pg.removeColor")}">✕</button>
        `;
        const picker = row.querySelector('input[type="color"]');
        const hexInput = row.querySelector("[data-hex]");
        const remove = row.querySelector("button");
        picker.addEventListener("input", () => {
          hexInput.value = picker.value.toUpperCase();
          writeColors();
        });
        hexInput.addEventListener("focus", () => hexInput.select());
        hexInput.addEventListener("change", () => {
          const next = normalizeHex(hexInput.value);
          if (!next) {
            hexInput.value = picker.value.toUpperCase();
            return;
          }
          hexInput.value = next;
          picker.value = next;
          writeColors();
          render();
        });
        remove.addEventListener("click", () => {
          if (colorList.children.length <= 2) return;
          row.remove();
          writeColors();
          render();
        });
        colorList.append(row);
      }

      function rebuildColors(raw) {
        const list = parseColorList(raw);
        colorList.replaceChildren();
        (list.length >= 2 ? list : ["#2EE59D", "#4FC3F7", "#00ACC1", "#80DEEA"]).forEach(addColorRow);
        writeColors();
      }

      for (const [label, value] of palettes) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "palette";
        button.dataset.colors = value;
        button.dataset.name = label;
        const dots = value.split(",").map((hex) => {
          const h = hex.trim().startsWith("#") ? hex.trim() : `#${hex.trim()}`;
          return `<i style="background:${h}"></i>`;
        }).join("");
        button.innerHTML = `<span class="swatches">${dots}</span>${label}`;
        button.addEventListener("click", () => {
          form.seed.value = label;
          rebuildColors(value);
          render();
        });
        paletteBox.append(button);
      }

      document.getElementById("add-color").addEventListener("click", () => {
        if (colorList.children.length >= 8) return;
        addColorRow("#80DEEA");
        writeColors();
        render();
      });

      function params() {
        const search = new URLSearchParams();
        search.set("w", String(form.w.value).trim());
        search.set("h", String(form.h.value).trim());
        search.set("seed", String(form.seed.value).trim());
        search.set("colors", String(form.colors.value).trim());
        search.set("warp", String(form.warp.value).trim());
        search.set("grain", String(form.grain.value).trim());
        search.set("blur", String(form.blur.value).trim());
        return search;
      }

      function path() {
        return `/gradient?${params().toString()}`;
      }

      function absolute() {
        return `${gigOrigin()}${path()}`;
      }

      function agentPrompt() {
        const origin = gigOrigin();
        const example = absolute();
        return [
          "You are helping me use Gradient Image Generator, an unauthenticated HTTP image API.",
          "Read the spec if reachable, otherwise use only this contract. Do not invent endpoints.",
          `Spec: ${origin}/llms.txt`,
          `Full spec: ${origin}/llms-full.txt`,
          `OpenAPI: ${origin}/openapi.json`,
          `Docs: ${origin}/docs`,
          `Playground: ${origin}/playground`,
          "Contract:",
          `GET ${origin}/gradient?w=&h=&seed=&colors=&warp=&grain=&blur=`,
          "Success is image/png. Broken numeric params return JSON 400 {error}. CORS is open. Same query always returns the same PNG.",
          "w/h: integer 16-2048, default 800, clamped. seed: any string, default 0. colors: 2+ hex (# optional), split by comma/space/|. warp: 0-1.5 default 0.62. grain: 0-0.2 default 0.035. blur: 0-32 default 0.",
          `Current example image: ${example}`,
          "Help me assemble URLs, embed them in HTML/Markdown/OG tags, and pick seeds/colors. If the origin is localhost you cannot fetch the spec; stay inside this prompt.",
        ].join("\n");
      }

      const aiHrefs = {
        chatgpt: (p) => `https://chatgpt.com/?hints=search&q=${encodeURIComponent(p)}`,
        claude: (p) => `https://claude.ai/new?q=${encodeURIComponent(p)}`,
        gemini: (p) => `https://gemini.google.com/app?prompt=${encodeURIComponent(p)}`,
      };

      function syncAiLinks() {
        const prompt = agentPrompt();
        for (const a of document.querySelectorAll("#ai-links [data-ai]")) {
          a.href = aiHrefs[a.dataset.ai](prompt);
        }
      }

      function syncChrome() {
        const w = Number(form.w.value);
        const h = Number(form.h.value);
        for (const button of sizeBox.querySelectorAll("button")) {
          button.classList.toggle("on", Number(button.dataset.w) === w && Number(button.dataset.h) === h);
        }
        const colors = String(form.colors.value).replace(/[#\s]/g, "").toLowerCase();
        const seed = String(form.seed.value).trim().toLowerCase();
        for (const button of paletteBox.querySelectorAll("button")) {
          const key = button.dataset.colors.replace(/[#\s]/g, "").toLowerCase();
          button.classList.toggle("on", key === colors && button.dataset.name.toLowerCase() === seed);
        }
        warpVal.textContent = Number(form.warp.value).toFixed(2);
        grainVal.textContent = Number(form.grain.value).toFixed(3);
        blurVal.textContent = String(Math.round(Number(form.blur.value)));
        form.warp.setAttribute("aria-valuetext", warpVal.textContent);
        form.grain.setAttribute("aria-valuetext", grainVal.textContent);
        form.blur.setAttribute("aria-valuetext", blurVal.textContent);
      }

      function render() {
        const w = Number(form.w.value) || 800;
        const h = Number(form.h.value) || 800;
        frame.style.setProperty("--ar", `${w} / ${h}`);
        const next = path();
        if (preview.getAttribute("src") !== next) {
          preview.classList.remove("ready");
          preview.src = next;
        } else if (preview.complete && preview.naturalWidth) {
          preview.classList.add("ready");
        }
        urlEl.textContent = absolute();
        syncChrome();
        syncAiLinks();
        history.replaceState(null, "", `/playground?${params().toString()}`);
      }

      const initial = new URLSearchParams(location.search);
      for (const [key, value] of initial.entries()) {
        if (form.elements[key]) form.elements[key].value = value;
      }
      rebuildColors(form.colors.value);

      let timer = 0;
      form.addEventListener("input", () => {
        syncChrome();
        clearTimeout(timer);
        timer = setTimeout(render, 180);
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        copyUrl();
      });
      preview.addEventListener("load", () => {
        frame.classList.remove("loading", "err");
        preview.classList.add("ready");
      });
      document.getElementById("random-seed").addEventListener("click", () => randomSeed());
      copyBtn.addEventListener("click", () => copyUrl());
      document.getElementById("copy-main").addEventListener("click", () => copyUrl());
      document.getElementById("copy-dock").addEventListener("click", () => copyUrl());
      document.getElementById("save-dock").addEventListener("click", () => document.getElementById("download").click());
      frame.addEventListener("click", () => copyUrl());
      const more = document.getElementById("more");
      const wide = window.matchMedia("(min-width: 1100px)");
      const syncMore = () => { more.open = wide.matches; };
      wide.addEventListener("change", syncMore);
      syncMore();
      document.getElementById("open").addEventListener("click", () => {
        window.open(absolute(), "_blank");
      });
      document.getElementById("download").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = path();
        a.download = `gradient-${form.seed.value || "image"}.png`;
        a.click();
      });

      const status = document.createElement("p");
      status.id = "status";
      status.className = "sr-only";
      status.setAttribute("aria-live", "polite");
      const toastEl = document.createElement("div");
      toastEl.id = "toast";
      toastEl.className = "toast";
      toastEl.hidden = true;
      document.body.append(status, toastEl);

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.hidden = false;
        status.textContent = msg;
        clearTimeout(toast.t);
        toast.t = setTimeout(() => { toastEl.hidden = true; }, 1600);
      }

      function clampDim(el) {
        const raw = Number(el.value);
        const n = Number.isFinite(raw) ? Math.min(2048, Math.max(16, Math.round(raw))) : 800;
        el.classList.toggle("invalid", !Number.isFinite(raw));
        if (String(n) !== el.value) el.value = String(n);
        return n;
      }

      function syncColorChrome() {
        const n = colorList.children.length;
        const count = document.getElementById("color-count");
        if (count) count.textContent = `${n} / 8`;
        document.getElementById("add-color").disabled = n >= 8;
        for (const btn of colorList.querySelectorAll("button")) {
          btn.disabled = n <= 2;
          const key = n <= 2 ? "pg.keepColors" : "pg.removeColor";
          btn.dataset.i18nTip = key;
          btn.dataset.i18nAria = key;
          btn.dataset.tip = t(key);
          btn.setAttribute("aria-label", t(key));
        }
      }

      const sizeHints = { "1:1": "800 × 800", OG: "1200 × 630", HD: "1920 × 1080", Story: "1080 × 1920" };
      for (const button of sizeBox.querySelectorAll("button")) {
        button.dataset.tip = sizeHints[button.textContent] ?? "";
      }
      const syncPaletteTips = () => {
        for (const button of paletteBox.querySelectorAll("button")) {
          button.dataset.tip = t("pg.presetTip", { name: button.dataset.name || button.textContent });
        }
      };
      for (const button of paletteBox.querySelectorAll("button")) {
        button.dataset.tip = t("pg.presetTip", { name: button.dataset.name || button.textContent });
      }

      const defaults = {
        w: "800",
        h: "800",
        seed: "jalapeno",
        colors: "#2EE59D, #4FC3F7, #00ACC1, #80DEEA",
        warp: "0.62",
        grain: "0.035",
        blur: "0",
      };

      async function copyUrl() {
        await navigator.clipboard.writeText(absolute());
        copyBtn.textContent = t("pg.copied");
        copyBtn.classList.add("copied");
        toast(t("pg.toastCopy"));
        setTimeout(() => {
          copyBtn.textContent = t("pg.copy");
          copyBtn.classList.remove("copied");
        }, 1200);
      }

      function randomSeed() {
        form.seed.value = Math.random().toString(36).slice(2, 10);
        render();
        toast(t("pg.toastSeed"));
      }

      const origAdd = addColorRow;
      addColorRow = function(hex) {
        origAdd(hex);
        syncColorChrome();
      };
      const origRebuild = rebuildColors;
      rebuildColors = function(raw) {
        origRebuild(raw);
        syncColorChrome();
      };

      colorList.addEventListener("paste", (event) => {
        const list = parseColorList(event.clipboardData.getData("text"));
        if (list.length < 2) return;
        event.preventDefault();
        rebuildColors(list.slice(0, 8).join(", "));
        render();
        toast(t("pg.toastPaste"));
      });

      form.w.addEventListener("change", () => { clampDim(form.w); render(); });
      form.h.addEventListener("change", () => { clampDim(form.h); render(); });
      form.seed.addEventListener("focus", () => form.seed.select());

      document.getElementById("swap").addEventListener("click", () => {
        const next = form.w.value;
        form.w.value = form.h.value;
        form.h.value = next;
        render();
      });
      document.getElementById("reset").addEventListener("click", () => {
        for (const [key, value] of Object.entries(defaults)) form.elements[key].value = value;
        rebuildColors(defaults.colors);
        render();
        toast(t("pg.toastReset"));
      });

      document.getElementById("copy-md").addEventListener("click", async () => {
        await navigator.clipboard.writeText(`![gradient](${absolute()})`);
        toast(t("pg.toastMd"));
      });
      document.getElementById("copy-play").addEventListener("click", async () => {
        await navigator.clipboard.writeText(`${gigOrigin()}/playground?${params().toString()}`);
        toast(t("pg.toastPlay"));
      });
      document.getElementById("copy-html").addEventListener("click", async () => {
        const w = form.w.value || 800;
        const h = form.h.value || 800;
        await navigator.clipboard.writeText(`<img src="${absolute()}" alt="" width="${w}" height="${h}" />`);
        toast(t("pg.toastHtml"));
      });

      urlEl.addEventListener("click", copyUrl);
      urlEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          copyUrl();
        }
      });

      document.addEventListener("keydown", (event) => {
        const el = document.activeElement;
        const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          render();
          return;
        }
        if (event.key === "Escape") {
          if (el && el.blur) el.blur();
          return;
        }
        if (event.key === "?" && !typing) {
          event.preventDefault();
          toast(t("pg.toastHelp"));
          return;
        }
        if (typing) return;
        if (event.key === "r" || event.key === "R") { event.preventDefault(); randomSeed(); }
        if (event.key === "c" || event.key === "C") { event.preventDefault(); copyUrl(); }
        if (event.key === "s" || event.key === "S") { event.preventDefault(); document.getElementById("download").click(); }
      });

      const prevSync = syncChrome;
      syncChrome = function() {
        prevSync();
        const w = Number(form.w.value) || 800;
        const h = Number(form.h.value) || 800;
        const hint = document.getElementById("size-hint");
        if (hint) hint.textContent = `${w} × ${h}`;
        syncColorChrome();
      };

      const prevRender = render;
      render = function() {
        clampDim(form.w);
        clampDim(form.h);
        frame.classList.add("loading");
        prevRender();
      };

      preview.addEventListener("error", () => {
        frame.classList.remove("loading");
        frame.classList.add("err");
        toast(t("pg.toastErr"));
      });

      const tip = document.createElement("div");
      tip.className = "tip-float";
      tip.hidden = true;
      document.body.append(tip);
      let tipEl = null;
      const placeTip = () => {
        if (!tipEl || !tipEl.isConnected) {
          tip.hidden = true;
          return;
        }
        const text = tipEl.getAttribute("data-tip");
        if (!text) {
          tip.hidden = true;
          return;
        }
        tip.textContent = text;
        tip.hidden = false;
        const gap = 8;
        const r = tipEl.getBoundingClientRect();
        const tw = tip.offsetWidth;
        const th = tip.offsetHeight;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const prefer = tipEl.getAttribute("data-tip-side") || "top";
        let top = prefer === "bottom" ? r.bottom + gap : r.top - th - gap;
        if (prefer !== "bottom" && top < gap) top = r.bottom + gap;
        if (top + th > vh - gap) top = Math.max(gap, r.top - th - gap);
        let left = r.left + r.width / 2 - tw / 2;
        if (prefer === "right") left = r.right + gap;
        if (prefer === "left") left = r.left - tw - gap;
        left = Math.min(Math.max(gap, left), vw - tw - gap);
        top = Math.min(Math.max(gap, top), vh - th - gap);
        tip.style.top = `${Math.round(top)}px`;
        tip.style.left = `${Math.round(left)}px`;
      };
      const showTip = (el) => { tipEl = el; placeTip(); };
      const hideTip = () => { tipEl = null; tip.hidden = true; };
      document.addEventListener("pointerover", (event) => {
        const el = event.target.closest("[data-tip]");
        if (el) showTip(el);
      });
      document.addEventListener("pointerout", (event) => {
        const el = event.target.closest("[data-tip]");
        if (!el || el.contains(event.relatedTarget)) return;
        if (document.activeElement !== el) hideTip();
      });
      document.addEventListener("focusin", (event) => {
        const el = event.target.closest("[data-tip]");
        if (el) showTip(el);
      });
      document.addEventListener("focusout", (event) => {
        if (tipEl && !tipEl.contains(event.relatedTarget)) hideTip();
      });
      window.addEventListener("scroll", placeTip, true);
      window.addEventListener("resize", placeTip);
      new MutationObserver(placeTip).observe(document.body, {
        subtree: true,
        attributes: true,
        attributeFilter: ["data-tip"],
      });

      if (window.I18N) {
        I18N.onChange(() => {
          syncColorChrome();
          syncPaletteTips();
        });
      }

      render();
    </script>
  </body>
</html>
