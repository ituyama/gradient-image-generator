<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · Gradient Image API</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #12141a;
        --panel-2: #181b23;
        --text: #f4f6fb;
        --muted: #8b93a7;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent: #f4f6fb;
        --ok: #7ee0b2;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(46, 229, 157, 0.12), transparent 50%),
          radial-gradient(900px 500px at 110% 10%, rgba(79, 195, 247, 0.1), transparent 46%),
          var(--bg);
        line-height: 1.45;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 12, 16, 0.72);
        backdrop-filter: blur(18px);
      }
      .bar {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        text-decoration: none;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(135deg, #2ee59d, #4fc3f7);
      }
      nav { display: flex; gap: 6px; }
      nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        padding: 7px 11px;
        border-radius: 999px;
      }
      nav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
      nav a.active { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 72px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: -0.05em;
        font-weight: 650;
      }
      .lede {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .lede a { color: var(--text); }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }
      .preview-wrap {
        position: sticky;
        top: 84px;
      }
      .preview {
        position: relative;
        width: 100%;
        aspect-ratio: var(--ar, 1);
        max-height: min(48vh, 520px);
        border-radius: 28px;
        overflow: hidden;
        background: #1a1d26;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        border: 1px solid var(--line);
      }
      .preview img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .preview img.ready { opacity: 1; }
      .urlbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        padding: 10px 10px 10px 14px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .urlbar code {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #c9d0df;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .urlbar button {
        flex: none;
      }
      .panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 28%), var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px;
      }
      .block + .block { margin-top: 18px; }
      .label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .label span { font-variant-numeric: tabular-nums; color: #d5dbe8; text-transform: none; letter-spacing: 0; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      input[type="number"], input[type="text"], textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        outline: none;
      }
      input:focus, textarea:focus {
        border-color: rgba(126, 224, 178, 0.55);
        box-shadow: 0 0 0 3px rgba(126, 224, 178, 0.12);
      }
      textarea { min-height: 74px; resize: vertical; }
      input[type="range"] {
        width: 100%;
        accent-color: #7ee0b2;
      }
      .seed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .seg, .palettes { display: flex; flex-wrap: wrap; gap: 8px; }
      .seg button, .chip, .icon-btn, .ghost, .primary {
        border: 1px solid var(--line-strong);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 11px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .seg button.on, .palette.on {
        border-color: transparent;
        background: var(--text);
        color: #111318;
      }
      .icon-btn { width: 42px; border-radius: 12px; }
      .palette {
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 10px 6px 6px;
      }
      .swatches { display: flex; }
      .swatches i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: -5px;
        border: 2px solid var(--panel-2);
        display: block;
      }
      .palette.on .swatches i { border-color: #f4f6fb; }
      .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
      .primary {
        grid-column: 1 / -1;
        border-radius: 14px;
        padding: 12px;
        background: var(--text);
        color: #111318;
        border: 0;
        font-size: 14px;
      }
      .ghost { border-radius: 14px; padding: 11px; }
      .ghost.copied { color: #0b0c10; background: var(--ok); border-color: transparent; }
      @media (min-width: 1100px) {
        .layout {
          grid-template-columns: minmax(0, 1.25fr) minmax(340px, 400px);
          grid-template-areas: "preview panel";
        }
        .preview-wrap { grid-area: preview; position: sticky; top: 84px; }
        .panel { grid-area: panel; }
        .preview { max-height: min(72vh, 720px); }
      }
      @media (max-width: 1099px) {
        .preview-wrap { position: static; }
        .hero { display: block; }
        h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/"><span class="mark"></span>Gradient Image API</a>
        <nav>
          <a class="active" href="/">Playground</a>
          <a href="/docs">Docs</a>
          <a href="/openapi.json">OpenAPI</a>
          <a href="/llms.txt">llms.txt</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="hero">
        <div>
          <h1>Playground</h1>
          <p class="lede">値を動かすと、その場で PNG の URL ができます。<a href="/docs">仕様は Docs</a></p>
        </div>
      </div>
      <div class="layout">
        <form class="panel" id="form">
          <div class="block">
            <div class="label">サイズ</div>
            <div class="row">
              <input id="w" name="w" type="number" min="16" max="2048" value="800" aria-label="幅" />
              <input id="h" name="h" type="number" min="16" max="2048" value="800" aria-label="高さ" />
            </div>
            <div class="seg" id="sizes" style="margin-top:10px"></div>
          </div>
          <div class="block">
            <div class="label">シード</div>
            <div class="seed-row">
              <input id="seed" name="seed" type="text" value="jalapeno" />
              <button class="icon-btn" type="button" id="random-seed" title="ランダム">↺</button>
            </div>
          </div>
          <div class="block">
            <div class="label">カラー</div>
            <textarea id="colors" name="colors">#2EE59D, #4FC3F7, #00ACC1, #80DEEA</textarea>
            <div class="palettes" id="palettes" style="margin-top:10px"></div>
          </div>
          <div class="block row">
            <div>
              <div class="label">ワープ <span id="warp-val">0.62</span></div>
              <input id="warp" name="warp" type="range" min="0" max="1.5" step="0.01" value="0.62" />
            </div>
            <div>
              <div class="label">グレイン <span id="grain-val">0.035</span></div>
              <input id="grain" name="grain" type="range" min="0" max="0.2" step="0.005" value="0.035" />
            </div>
          </div>
          <div class="block">
            <div class="label">ぼかし blur <span id="blur-val">0</span></div>
            <input id="blur" name="blur" type="range" min="0" max="32" step="1" value="0" />
          </div>
          <div class="actions">
            <button class="primary" type="submit">生成する</button>
            <button class="ghost" type="button" id="open">新しいタブ</button>
            <button class="ghost" type="button" id="download">保存</button>
          </div>
        </form>
        <div class="preview-wrap">
          <div class="preview" id="frame">
            <img id="preview" alt="生成されたグラデーション" />
          </div>
          <div class="urlbar">
            <code id="url"></code>
            <button class="ghost" type="button" id="copy">コピー</button>
          </div>
        </div>
      </div>
    </main>
    <script>
      const form = document.getElementById("form");
      const preview = document.getElementById("preview");
      const urlEl = document.getElementById("url");
      const frame = document.getElementById("frame");
      const copyBtn = document.getElementById("copy");
      const warpVal = document.getElementById("warp-val");
      const grainVal = document.getElementById("grain-val");
      const blurVal = document.getElementById("blur-val");

      const sizes = [
        ["1:1", 800, 800],
        ["OG", 1200, 630],
        ["HD", 1920, 1080],
        ["Story", 1080, 1920],
      ];
      const palettes = [
        ["Mint", "#2EE59D, #4FC3F7, #00ACC1, #80DEEA"],
        ["Sunset", "#FF6B6B, #FFD93D, #FF8C42, #C44569"],
        ["Twilight", "#7C5CFF, #49C6E5, #F472B6, #1E1B4B"],
        ["Peach", "#FFB4A2, #E5989B, #FFCDB2, #B5838D"],
      ];

      const sizeBox = document.getElementById("sizes");
      for (const [label, w, h] of sizes) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.dataset.w = String(w);
        button.dataset.h = String(h);
        button.addEventListener("click", () => {
          form.w.value = w;
          form.h.value = h;
          render();
        });
        sizeBox.append(button);
      }

      const paletteBox = document.getElementById("palettes");
      for (const [label, value] of palettes) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "palette";
        button.dataset.colors = value;
        const dots = value.split(",").map((hex) => `<i style="background:${hex.trim()}"></i>`).join("");
        button.innerHTML = `<span class="swatches">${dots}</span>${label}`;
        button.addEventListener("click", () => {
          form.colors.value = value;
          render();
        });
        paletteBox.append(button);
      }

      function params() {
        const search = new URLSearchParams();
        search.set("w", String(form.w.value).trim());
        search.set("h", String(form.h.value).trim());
        search.set("seed", String(form.seed.value).trim());
        search.set("colors", String(form.colors.value).trim());
        search.set("warp", String(form.warp.value).trim());
        search.set("grain", String(form.grain.value).trim());
        search.set("blur", String(form.blur.value).trim());
        return search;
      }

      function path() {
        return `/gradient?${params().toString()}`;
      }

      function absolute() {
        return `${location.origin}${path()}`;
      }

      function syncChrome() {
        const w = Number(form.w.value);
        const h = Number(form.h.value);
        for (const button of sizeBox.querySelectorAll("button")) {
          button.classList.toggle("on", Number(button.dataset.w) === w && Number(button.dataset.h) === h);
        }
        const colors = String(form.colors.value).replace(/\s/g, "").toLowerCase();
        for (const button of paletteBox.querySelectorAll("button")) {
          const key = button.dataset.colors.replace(/\s/g, "").toLowerCase();
          button.classList.toggle("on", key === colors);
        }
        warpVal.textContent = Number(form.warp.value).toFixed(2);
        grainVal.textContent = Number(form.grain.value).toFixed(3);
        blurVal.textContent = String(Math.round(Number(form.blur.value)));
      }

      function render() {
        const w = Number(form.w.value) || 800;
        const h = Number(form.h.value) || 800;
        frame.style.setProperty("--ar", `${w} / ${h}`);
        const next = path();
        if (preview.getAttribute("src") !== next) {
          preview.classList.remove("ready");
          preview.src = next;
        } else if (preview.complete && preview.naturalWidth) {
          preview.classList.add("ready");
        }
        urlEl.textContent = absolute();
        syncChrome();
        history.replaceState(null, "", `/?${params().toString()}`);
      }

      const initial = new URLSearchParams(location.search);
      for (const [key, value] of initial.entries()) {
        if (form.elements[key]) form.elements[key].value = value;
      }

      let timer = 0;
      form.addEventListener("input", () => {
        syncChrome();
        clearTimeout(timer);
        timer = setTimeout(render, 180);
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        render();
      });
      preview.addEventListener("load", () => preview.classList.add("ready"));
      document.getElementById("random-seed").addEventListener("click", () => {
        form.seed.value = Math.random().toString(36).slice(2, 10);
        render();
      });
      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(absolute());
        copyBtn.textContent = "コピー済み";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "コピー";
          copyBtn.classList.remove("copied");
        }, 1200);
      });
      document.getElementById("open").addEventListener("click", () => {
        window.open(absolute(), "_blank");
      });
      document.getElementById("download").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = path();
        a.download = `gradient-${form.seed.value || "image"}.png`;
        a.click();
      });

      render();
    </script>
  </body>
</html>
