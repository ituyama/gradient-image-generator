<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · Gradient Image API</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f8;
        --card: #fff;
        --text: #111318;
        --muted: #667085;
        --line: #e5e7ee;
        --accent: #111318;
        --chip: #eef0f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(12px);
        background: rgba(244, 245, 248, 0.88);
        border-bottom: 1px solid var(--line);
      }
      .bar, main { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 60px;
        gap: 16px;
      }
      .brand { font-weight: 700; letter-spacing: -0.03em; color: inherit; text-decoration: none; }
      nav { display: flex; gap: 16px; font-size: 14px; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a:hover, nav a.active { color: var(--text); }
      main { padding-top: 28px; padding-bottom: 80px; }
      h1 { font-size: 36px; letter-spacing: -0.04em; margin: 0 0 10px; }
      .lede { color: var(--muted); margin: 0 0 24px; max-width: 62ch; }
      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 24px;
        align-items: start;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
      }
      label { display: block; font-size: 12px; font-weight: 700; margin: 12px 0 6px; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }
      textarea { min-height: 70px; resize: vertical; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .chip {
        border: 0;
        border-radius: 999px;
        padding: 6px 10px;
        background: var(--chip);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
      button.primary, button.ghost, a.ghost {
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary { border: 0; background: var(--accent); color: #fff; }
      button.ghost, a.ghost {
        border: 1px solid var(--line);
        background: #fff;
        color: inherit;
        text-decoration: none;
        display: grid;
        place-items: center;
      }
      .preview-wrap { position: sticky; top: 80px; }
      .preview {
        width: 100%;
        max-height: min(68vh, 640px);
        aspect-ratio: var(--ar, 1);
        border-radius: 28px;
        overflow: hidden;
        background: #e8eaef;
        box-shadow: 0 16px 40px rgba(17, 19, 24, 0.08);
      }
      .preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .urlbox {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: #111318;
        color: #e8eaef;
        font-size: 12px;
        overflow-x: auto;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; }
        .preview-wrap { position: static; }
        h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/">Gradient Image API</a>
        <nav>
          <a class="active" href="/">Playground</a>
          <a href="/docs">Docs</a>
          <a href="/openapi.json">OpenAPI</a>
          <a href="/llms.txt">llms.txt</a>
        </nav>
      </div>
    </header>
    <main>
      <h1>Playground</h1>
      <p class="lede">
        パラメータをいじると、その場で PNG の URL ができます。仕様は
        <a href="/docs">ドキュメント</a> にあります。
      </p>
      <div class="layout">
        <form class="card" id="form">
          <div class="row">
            <div>
              <label for="w">幅 w</label>
              <input id="w" name="w" type="number" min="16" max="2048" value="800" />
            </div>
            <div>
              <label for="h">高さ h</label>
              <input id="h" name="h" type="number" min="16" max="2048" value="800" />
            </div>
          </div>
          <div class="chips" id="sizes"></div>
          <label for="seed">シード seed</label>
          <input id="seed" name="seed" value="jalapeno" />
          <div class="chips">
            <button class="chip" type="button" id="random-seed">ランダム</button>
          </div>
          <label for="colors">色 colors</label>
          <textarea id="colors" name="colors">#2EE59D, #4FC3F7, #00ACC1, #80DEEA</textarea>
          <div class="chips" id="palettes"></div>
          <div class="row">
            <div>
              <label for="warp">ワープ warp</label>
              <input id="warp" name="warp" type="number" min="0" max="1.5" step="0.05" value="0.62" />
            </div>
            <div>
              <label for="grain">グレイン grain</label>
              <input id="grain" name="grain" type="number" min="0" max="0.2" step="0.005" value="0.035" />
            </div>
          </div>
          <div class="actions">
            <button class="primary" type="submit">生成</button>
            <button class="ghost" type="button" id="copy">URL をコピー</button>
            <button class="ghost" type="button" id="open">新しいタブ</button>
            <button class="ghost" type="button" id="download">ダウンロード</button>
          </div>
        </form>
        <div class="preview-wrap">
          <div class="preview" id="frame">
            <img id="preview" alt="生成されたグラデーション" />
          </div>
          <div class="urlbox" id="url"></div>
        </div>
      </div>
    </main>
    <script>
      const form = document.getElementById("form");
      const preview = document.getElementById("preview");
      const urlEl = document.getElementById("url");
      const frame = document.getElementById("frame");

      const sizes = [
        ["800²", 800, 800],
        ["OG 1200×630", 1200, 630],
        ["HD 1920×1080", 1920, 1080],
        ["Story 1080×1920", 1080, 1920],
      ];
      const palettes = [
        ["Mint", "#2EE59D, #4FC3F7, #00ACC1, #80DEEA"],
        ["Sunset", "#FF6B6B, #FFD93D, #FF8C42, #C44569"],
        ["Twilight", "#7C5CFF, #49C6E5, #F472B6, #1E1B4B"],
        ["Peach", "#FFB4A2, #E5989B, #FFCDB2, #B5838D"],
      ];

      const sizeBox = document.getElementById("sizes");
      for (const [label, w, h] of sizes) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.textContent = label;
        button.addEventListener("click", () => {
          form.w.value = w;
          form.h.value = h;
          render();
        });
        sizeBox.append(button);
      }

      const paletteBox = document.getElementById("palettes");
      for (const [label, value] of palettes) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.textContent = label;
        button.addEventListener("click", () => {
          form.colors.value = value;
          render();
        });
        paletteBox.append(button);
      }

      function params() {
        const data = new FormData(form);
        const search = new URLSearchParams();
        for (const [key, value] of data.entries()) {
          search.set(key, String(value).trim());
        }
        return search;
      }

      function path() {
        return `/gradient?${params().toString()}`;
      }

      function absolute() {
        return `${location.origin}${path()}`;
      }

      function render() {
        const w = Number(form.w.value) || 800;
        const h = Number(form.h.value) || 800;
        frame.style.setProperty("--ar", `${w} / ${h}`);
        preview.src = path();
        urlEl.textContent = absolute();
        history.replaceState(null, "", `/?${params().toString()}`);
      }

      const initial = new URLSearchParams(location.search);
      for (const [key, value] of initial.entries()) {
        if (form.elements[key]) form.elements[key].value = value;
      }

      let timer = 0;
      form.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(render, 220);
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        render();
      });
      document.getElementById("random-seed").addEventListener("click", () => {
        form.seed.value = Math.random().toString(36).slice(2, 10);
        render();
      });
      document.getElementById("copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(absolute());
      });
      document.getElementById("open").addEventListener("click", () => {
        window.open(absolute(), "_blank");
      });
      document.getElementById("download").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = path();
        a.download = `gradient-${form.seed.value || "image"}.png`;
        a.click();
      });

      render();
    </script>
  </body>
</html>
