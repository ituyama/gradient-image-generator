<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · Gradient Image API</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #12141a;
        --panel-2: #181b23;
        --text: #f4f6fb;
        --muted: #8b93a7;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent: #f4f6fb;
        --ok: #7ee0b2;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(46, 229, 157, 0.12), transparent 50%),
          radial-gradient(900px 500px at 110% 10%, rgba(79, 195, 247, 0.1), transparent 46%),
          var(--bg);
        line-height: 1.45;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 12, 16, 0.72);
        backdrop-filter: blur(18px);
      }
      .bar {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        text-decoration: none;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(135deg, #2ee59d, #4fc3f7);
      }
      nav { display: flex; gap: 6px; }
      nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        padding: 7px 11px;
        border-radius: 999px;
      }
      nav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
      nav a.active { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 72px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: -0.05em;
        font-weight: 650;
      }
      .lede {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .lede a { color: var(--text); }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }
      .preview-wrap {
        position: sticky;
        top: 84px;
      }
      .preview {
        position: relative;
        width: 100%;
        aspect-ratio: var(--ar, 1);
        max-height: min(48vh, 520px);
        border-radius: 28px;
        overflow: hidden;
        background: #1a1d26;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        border: 1px solid var(--line);
      }
      .preview img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .preview img.ready { opacity: 1; }
      .urlbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        padding: 10px 10px 10px 14px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .urlbar code {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #c9d0df;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .urlbar button {
        flex: none;
      }
      .ai-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .ai-row .label {
        margin: 0;
      }
      .ai-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ai-links a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 0;
        color: #fff;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }
      .ai-links a[data-ai="chatgpt"] { background: #10a37f; }
      .ai-links a[data-ai="claude"] { background: #d97757; }
      .ai-links a[data-ai="gemini"] { background: #1a73e8; }
      .ai-links a:hover { filter: brightness(1.08); }
      .ai-links .logo { width: 14px; height: 14px; pointer-events: none; }
      .panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 28%), var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px;
      }
      .block + .block { margin-top: 18px; }
      .label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .label span { font-variant-numeric: tabular-nums; color: #d5dbe8; text-transform: none; letter-spacing: 0; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      input[type="number"], input[type="text"], textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        outline: none;
      }
      input:focus, textarea:focus {
        border-color: rgba(126, 224, 178, 0.55);
        box-shadow: 0 0 0 3px rgba(126, 224, 178, 0.12);
      }
      input[type="range"] {
        width: 100%;
        accent-color: #7ee0b2;
      }
      .seed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .seg, .palettes { display: flex; flex-wrap: wrap; gap: 8px; }
      .seg button, .chip, .icon-btn, .ghost, .primary {
        border: 1px solid var(--line-strong);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 11px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .seg button.on, .palette.on {
        border-color: transparent;
        background: var(--text);
        color: #111318;
      }
      .icon-btn { width: 42px; border-radius: 12px; }
      .palette {
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 10px 6px 6px;
      }
      .swatches { display: flex; }
      .swatches i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: -5px;
        border: 2px solid var(--panel-2);
        display: block;
      }
      .palette.on .swatches i { border-color: #f4f6fb; }
      .color-list { display: grid; gap: 8px; }
      .color-row {
        display: grid;
        grid-template-columns: 44px 1fr 36px;
        gap: 8px;
        align-items: center;
      }
      .color-row input[type="color"] {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--panel-2);
        cursor: pointer;
      }
      .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
      .color-row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 8px;
      }
      .color-row input[data-hex] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .add-color {
        width: 100%;
        margin-top: 8px;
        border-radius: 12px;
      }
      .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
      .primary {
        grid-column: 1 / -1;
        border-radius: 14px;
        padding: 12px;
        background: var(--text);
        color: #111318;
        border: 0;
        font-size: 14px;
      }
      .ghost { border-radius: 14px; padding: 11px; }
      .ghost.copied { color: #0b0c10; background: var(--ok); border-color: transparent; }
      [data-tip] { position: relative; }
      [data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: #f4f6fb;
        color: #111318;
        font-size: 11px;
        font-weight: 650;
        padding: 5px 8px;
        border-radius: 7px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        z-index: 40;
      }
      [data-tip]:hover::after,
      [data-tip]:focus-visible::after { opacity: 1; }
      @media (min-width: 1100px) {
        .layout {
          grid-template-columns: minmax(0, 1.25fr) minmax(340px, 400px);
          grid-template-areas: "preview panel";
        }
        .preview-wrap { grid-area: preview; position: sticky; top: 84px; }
        .panel { grid-area: panel; }
        .preview { max-height: min(72vh, 720px); }
      }
      @media (max-width: 1099px) {
        .preview-wrap { position: static; }
        .hero { display: block; }
        h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/"><span class="mark"></span>Gradient Image API</a>
        <nav>
          <a class="active" href="/">Playground</a>
          <a href="/docs">Docs</a>
          <a href="/openapi.json">OpenAPI</a>
          <a href="/llms.txt">llms.txt</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="hero">
        <div>
          <h1>Playground</h1>
          <p class="lede">値を動かすと、その場で PNG の URL ができます。<a href="/docs">仕様は Docs</a></p>
        </div>
      </div>
      <div class="layout">
        <form class="panel" id="form">
          <div class="block">
            <div class="label">サイズ</div>
            <div class="row">
              <input id="w" name="w" type="number" min="16" max="2048" value="800" aria-label="幅" />
              <input id="h" name="h" type="number" min="16" max="2048" value="800" aria-label="高さ" />
            </div>
            <div class="seg" id="sizes" style="margin-top:10px"></div>
          </div>
          <div class="block">
            <div class="label">シード</div>
            <div class="seed-row">
              <input id="seed" name="seed" type="text" value="jalapeno" />
              <button class="icon-btn" type="button" id="random-seed" data-tip="シードをランダムに" aria-label="シードをランダムに">↺</button>
            </div>
          </div>
          <div class="block">
            <div class="label">カラー</div>
            <input id="colors" name="colors" type="hidden" value="#2EE59D, #4FC3F7, #00ACC1, #80DEEA" />
            <div class="color-list" id="color-list"></div>
            <button class="ghost add-color" type="button" id="add-color" data-tip="パレットに色を1つ足す">色を追加</button>
            <div class="palettes" id="palettes" style="margin-top:10px"></div>
          </div>
          <div class="block row">
            <div>
              <div class="label">ワープ <span id="warp-val">0.62</span></div>
              <input id="warp" name="warp" type="range" min="0" max="1.5" step="0.01" value="0.62" />
            </div>
            <div>
              <div class="label">グレイン <span id="grain-val">0.035</span></div>
              <input id="grain" name="grain" type="range" min="0" max="0.2" step="0.005" value="0.035" />
            </div>
          </div>
          <div class="block">
            <div class="label">ぼかし blur <span id="blur-val">0</span></div>
            <input id="blur" name="blur" type="range" min="0" max="32" step="1" value="0" />
          </div>
          <div class="actions">
            <button class="primary" type="submit">生成する</button>
            <button class="ghost" type="button" id="open" data-tip="PNG を新しいタブで開く">新しいタブ</button>
            <button class="ghost" type="button" id="download" data-tip="PNG を保存">保存</button>
          </div>
        </form>
        <div class="preview-wrap">
          <div class="preview" id="frame">
            <img id="preview" alt="生成されたグラデーション" />
          </div>
          <div class="urlbar">
            <code id="url"></code>
            <button class="ghost" type="button" id="copy" data-tip="URL をコピー">コピー</button>
          </div>
          <div class="ai-row">
            <div class="label">チャット</div>
            <div class="ai-links" id="ai-links">
              <a data-ai="chatgpt" target="_blank" rel="noreferrer" data-tip="今の画像で ChatGPT を開く">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.374v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.777-5.833-3.387L15.119 7.12a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.409-.667zm2.01-3.023-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.2V6.865a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.37-3.453l-.142.08-4.778 2.758a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg>
                ChatGPT
              </a>
              <a data-ai="claude" target="_blank" rel="noreferrer" data-tip="今の画像で Claude を開く">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>
                Claude
              </a>
              <a data-ai="gemini" target="_blank" rel="noreferrer" data-tip="今の画像で Gemini を開く">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6c.4 5 2.6 8.8 9.4 10.4C14.6 13.6 12.4 17.4 12 22.4 11.6 17.4 9.4 13.6 2.6 12 9.4 10.4 11.6 6.6 12 1.6z"/></svg>
                Gemini
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>
      const form = document.getElementById("form");
      const preview = document.getElementById("preview");
      const urlEl = document.getElementById("url");
      const frame = document.getElementById("frame");
      const copyBtn = document.getElementById("copy");
      const warpVal = document.getElementById("warp-val");
      const grainVal = document.getElementById("grain-val");
      const blurVal = document.getElementById("blur-val");

      const sizes = [
        ["1:1", 800, 800],
        ["OG", 1200, 630],
        ["HD", 1920, 1080],
        ["Story", 1080, 1920],
      ];
      const palettes = [
        ["Mint", "#2EE59D, #4FC3F7, #00ACC1, #80DEEA"],
        ["Sunset", "#FF6B6B, #FFD93D, #FF8C42, #C44569"],
        ["Twilight", "#7C5CFF, #49C6E5, #F472B6, #1E1B4B"],
        ["Peach", "#FFB4A2, #E5989B, #FFCDB2, #B5838D"],
      ];

      const sizeBox = document.getElementById("sizes");
      for (const [label, w, h] of sizes) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.dataset.w = String(w);
        button.dataset.h = String(h);
        button.addEventListener("click", () => {
          form.w.value = w;
          form.h.value = h;
          render();
        });
        sizeBox.append(button);
      }

      const colorList = document.getElementById("color-list");
      const paletteBox = document.getElementById("palettes");

      function normalizeHex(raw) {
        let hex = String(raw).trim();
        if (!hex) return null;
        if (!hex.startsWith("#")) hex = `#${hex}`;
        if (/^#[0-9a-f]{3}$/i.test(hex)) {
          hex = `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`;
        }
        return /^#[0-9a-f]{6}$/i.test(hex) ? hex.toUpperCase() : null;
      }

      function parseColorList(raw) {
        return String(raw)
          .split(/[,| ]+/)
          .map(normalizeHex)
          .filter(Boolean);
      }

      function writeColors() {
        const hexes = [...colorList.querySelectorAll("[data-hex]")].map((input) => input.value);
        form.colors.value = hexes.join(", ");
      }

      function addColorRow(hex) {
        const color = normalizeHex(hex) ?? "#80DEEA";
        const row = document.createElement("div");
        row.className = "color-row";
        row.innerHTML = `
          <input type="color" value="${color}" aria-label="色" />
          <input data-hex type="text" spellcheck="false" maxlength="7" value="${color}" aria-label="HEX" />
          <button class="icon-btn" type="button" aria-label="削除" data-tip="この色を削除">✕</button>
        `;
        const picker = row.querySelector('input[type="color"]');
        const hexInput = row.querySelector("[data-hex]");
        const remove = row.querySelector("button");
        picker.addEventListener("input", () => {
          hexInput.value = picker.value.toUpperCase();
          writeColors();
        });
        hexInput.addEventListener("change", () => {
          const next = normalizeHex(hexInput.value);
          if (!next) {
            hexInput.value = picker.value.toUpperCase();
            return;
          }
          hexInput.value = next;
          picker.value = next;
          writeColors();
          render();
        });
        remove.addEventListener("click", () => {
          if (colorList.children.length <= 2) return;
          row.remove();
          writeColors();
          render();
        });
        colorList.append(row);
      }

      function rebuildColors(raw) {
        const list = parseColorList(raw);
        colorList.replaceChildren();
        (list.length >= 2 ? list : ["#2EE59D", "#4FC3F7", "#00ACC1", "#80DEEA"]).forEach(addColorRow);
        writeColors();
      }

      for (const [label, value] of palettes) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "palette";
        button.dataset.colors = value;
        const dots = value.split(",").map((hex) => `<i style="background:${hex.trim()}"></i>`).join("");
        button.innerHTML = `<span class="swatches">${dots}</span>${label}`;
        button.addEventListener("click", () => {
          rebuildColors(value);
          render();
        });
        paletteBox.append(button);
      }

      document.getElementById("add-color").addEventListener("click", () => {
        if (colorList.children.length >= 8) return;
        addColorRow("#80DEEA");
        writeColors();
        render();
      });

      function params() {
        const search = new URLSearchParams();
        search.set("w", String(form.w.value).trim());
        search.set("h", String(form.h.value).trim());
        search.set("seed", String(form.seed.value).trim());
        search.set("colors", String(form.colors.value).trim());
        search.set("warp", String(form.warp.value).trim());
        search.set("grain", String(form.grain.value).trim());
        search.set("blur", String(form.blur.value).trim());
        return search;
      }

      function path() {
        return `/gradient?${params().toString()}`;
      }

      function absolute() {
        return `${location.origin}${path()}`;
      }

      function agentPrompt() {
        const origin = location.origin;
        const example = absolute();
        return [
          "You are helping me use Gradient Image Generator, an unauthenticated HTTP image API.",
          "Read the spec if reachable, otherwise use only this contract. Do not invent endpoints.",
          `Spec: ${origin}/llms.txt`,
          `Full spec: ${origin}/llms-full.txt`,
          `OpenAPI: ${origin}/openapi.json`,
          `Docs: ${origin}/docs`,
          `Playground: ${origin}/`,
          "Contract:",
          `GET ${origin}/gradient?w=&h=&seed=&colors=&warp=&grain=&blur=`,
          "Success is image/png. Broken numeric params return JSON 400 {error}. CORS is open. Same query always returns the same PNG.",
          "w/h: integer 16-2048, default 800, clamped. seed: any string, default 0. colors: 2+ hex (# optional), split by comma/space/|. warp: 0-1.5 default 0.62. grain: 0-0.2 default 0.035. blur: 0-32 default 0.",
          `Current example image: ${example}`,
          "Help me assemble URLs, embed them in HTML/Markdown/OG tags, and pick seeds/colors. If the origin is localhost you cannot fetch the spec; stay inside this prompt.",
        ].join("\n");
      }

      const aiHrefs = {
        chatgpt: (p) => `https://chatgpt.com/?hints=search&q=${encodeURIComponent(p)}`,
        claude: (p) => `https://claude.ai/new?q=${encodeURIComponent(p)}`,
        gemini: (p) => `https://gemini.google.com/app?prompt=${encodeURIComponent(p)}`,
      };

      function syncAiLinks() {
        const prompt = agentPrompt();
        for (const a of document.querySelectorAll("#ai-links [data-ai]")) {
          a.href = aiHrefs[a.dataset.ai](prompt);
        }
      }

      function syncChrome() {
        const w = Number(form.w.value);
        const h = Number(form.h.value);
        for (const button of sizeBox.querySelectorAll("button")) {
          button.classList.toggle("on", Number(button.dataset.w) === w && Number(button.dataset.h) === h);
        }
        const colors = String(form.colors.value).replace(/\s/g, "").toLowerCase();
        for (const button of paletteBox.querySelectorAll("button")) {
          const key = button.dataset.colors.replace(/\s/g, "").toLowerCase();
          button.classList.toggle("on", key === colors);
        }
        warpVal.textContent = Number(form.warp.value).toFixed(2);
        grainVal.textContent = Number(form.grain.value).toFixed(3);
        blurVal.textContent = String(Math.round(Number(form.blur.value)));
      }

      function render() {
        const w = Number(form.w.value) || 800;
        const h = Number(form.h.value) || 800;
        frame.style.setProperty("--ar", `${w} / ${h}`);
        const next = path();
        if (preview.getAttribute("src") !== next) {
          preview.classList.remove("ready");
          preview.src = next;
        } else if (preview.complete && preview.naturalWidth) {
          preview.classList.add("ready");
        }
        urlEl.textContent = absolute();
        syncChrome();
        syncAiLinks();
        history.replaceState(null, "", `/?${params().toString()}`);
      }

      const initial = new URLSearchParams(location.search);
      for (const [key, value] of initial.entries()) {
        if (form.elements[key]) form.elements[key].value = value;
      }
      rebuildColors(form.colors.value);

      let timer = 0;
      form.addEventListener("input", () => {
        syncChrome();
        clearTimeout(timer);
        timer = setTimeout(render, 180);
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        render();
      });
      preview.addEventListener("load", () => preview.classList.add("ready"));
      document.getElementById("random-seed").addEventListener("click", () => {
        form.seed.value = Math.random().toString(36).slice(2, 10);
        render();
      });
      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(absolute());
        copyBtn.textContent = "コピー済み";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "コピー";
          copyBtn.classList.remove("copied");
        }, 1200);
      });
      document.getElementById("open").addEventListener("click", () => {
        window.open(absolute(), "_blank");
      });
      document.getElementById("download").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = path();
        a.download = `gradient-${form.seed.value || "image"}.png`;
        a.click();
      });

      render();
    </script>
  </body>
</html>
